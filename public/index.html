<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>概念 × 状态 · 3D 架构工作台</title><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script></head>
<body>
<header><a class="brand" href="/" aria-label="架构工作台主页"><span class="brand-mark">⌘</span><span>概念 <b>×</b> 状态<small>ARCHITECTURE WORKBENCH</small></span></a><span class="notice" id="notice">架构示意 · 非网络运行</span><div class="header-actions"><span class="git-meta" id="git-meta">Git 检查中</span><span class="version" id="version">载入中</span><button id="refresh" title="重新读取本地 JSON">↻ 刷新源文件</button><button id="export">导出 JSON</button><button id="import">导入 JSON</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></header>
<div id="banner" role="alert" hidden></div>
<main><aside class="navigator"><div class="section-eyebrow">架构索引 <span id="count"></span></div><label class="search-box"><span>⌕</span><input id="search" placeholder="搜索名称、ID、端口或旧引用" autocomplete="off" aria-label="搜索架构"><kbd>/</kbd></label><div id="search-results" hidden></div><div id="navigation"><div class="section-label">功能路径 <span>共享同一概念核心</span></div><div id="routes" class="routes"></div><div class="section-label">结构层级</div><div id="tree" class="tree"></div></div><div class="sidebar-footer"><label class="switch-row"><input id="show-deprecated" type="checkbox">显示已弃用结构</label><details><summary>状态图例</summary><div class="legend"><span><i class="confirmed"></i>已确认 · 设计决定</span><span><i class="candidate"></i>候选 · 待比较</span><span><i class="unresolved"></i>未解决 · 待定义</span><span><i class="deprecated"></i>已弃用 · 保留引用</span></div><p>颜色表示架构决策状态，不表示机制已获实证。</p></details></div></aside>
<section id="viewport" aria-label="可交互三维架构"><div class="canvas-toolbar"><nav id="breadcrumbs" aria-label="结构路径"></nav><div><button id="expand">展开全部</button><button id="reset" title="恢复当前视角">重置视角</button></div></div><div id="labels"></div><div class="canvas-bottom"><span>拖动旋转 · 滚轮缩放 · 右键平移 · 双击进入</span><label><input id="demo" type="checkbox">信号演示 <em>示意 · 非运行</em></label></div><div id="loading">正在建立三维视图…</div></section>
<aside id="inspector" class="inspector"><div id="inspection"></div></aside></main>
<div id="toast" role="status" hidden></div>
<dialog id="import-dialog"><div class="dialog-head"><h2>导入预览</h2><button id="close-import" aria-label="关闭导入预览">×</button></div><p id="import-summary"></p><pre id="import-validation"></pre><p class="muted">应用时会生成新版本并保留旧版快照。现有 ID 必须保留、弃用或迁入 tombstone。</p><div class="dialog-actions"><button id="cancel-import">取消</button><button id="apply-import" class="primary">应用并保存新版本</button></div></dialog>
<script type="module" src="/app.js"></script></body></html>
